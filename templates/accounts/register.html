{% extends "base.html" %}
{% block title %}Kayıt Ol · Kararsızım{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Kayıt Ol</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    {% include "partials/form_fields.html" %}
    <button type="submit" class="button">Kayıt Ol</button>
  </form>
  <p class="auth-card__alt">Zaten üye misin?
    <a href="{% url 'login' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Giriş yap</a>
  </p>
</section>
{% endblock %}
