{% extends "base.html" %}
{% block title %}Giriş · Kararsızım{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Giriş</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    {% include "partials/form_fields.html" %}
    <button type="submit" class="button">Giriş Yap</button>
  </form>
  <p class="auth-card__alt">Hesabın yok mu?
    <a href="{% url 'register' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Kayıt ol</a>
  </p>
</section>
{% endblock %}
