<header class="navbar">
  <a class="navbar__brand" href="{% url 'home' %}">Kararsızım</a>

  <nav class="navbar__links" aria-label="Ana menü">
    <a class="button button--small" href="{% url 'poll_create' %}">+ Anket Oluştur</a>
    {% if user.is_authenticated %}
      <span class="navbar__user">@{{ user.username }}</span>
      <a href="{% url 'my_polls' %}">Anketlerim</a>
      <form method="post" action="{% url 'logout' %}" class="inline-form">
        {% csrf_token %}
        <button type="submit" class="link-button">Çıkış</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}">Giriş</a>
      <a href="{% url 'register' %}">Kayıt Ol</a>
    {% endif %}
  </nav>
</header>
