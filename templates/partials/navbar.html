{% load static %}
<header class="navbar">
  <div class="navbar__inner">
    <a class="navbar__brand" href="{% url 'home' %}">
      <img src="{% static 'img/logo.svg' %}" alt="" width="40" height="40">
      <span>Kararsızım</span>
    </a>

    <nav class="navbar__links" aria-label="Ana menü">
      {% if user.is_authenticated %}
        <span class="navbar__user">@{{ user.username }}</span>
        <a class="navbar__link" href="{% url 'my_polls' %}">Anketlerim</a>
        <form method="post" action="{% url 'logout' %}" class="inline-form">
          {% csrf_token %}
          <button type="submit" class="navbar__link link-button">Çıkış</button>
        </form>
      {% else %}
        <a class="navbar__link" href="{% url 'login' %}">Giriş</a>
        <a class="navbar__link" href="{% url 'register' %}">Kayıt Ol</a>
      {% endif %}
    </nav>

    <a class="button button--primary button--small navbar__cta" href="{% url 'poll_create' %}">+ Anket Oluştur</a>
  </div>
</header>
